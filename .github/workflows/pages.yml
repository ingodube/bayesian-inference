name: Validate and deploy Bayesian Prior Lab
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m pip install -r dashboard/requirements.lock.txt
          npm ci --prefix web
      - name: Validate statistics and build presentation
        run: |
          Rscript --vanilla research-pipeline/tests.R
          Rscript --vanilla research-pipeline/export-fixtures.R
          python dashboard/build.py
          python -m pytest dashboard/tests -q
          npm --prefix web run prepare:runtime
          npm --prefix web test
      - name: Verify native R against webR
        working-directory: web
        run: node scripts/verify-parity.mjs
      - name: Build static application
        run: npm --prefix web run build
      - uses: actions/upload-artifact@v4
        with:
          name: statistical-validation
          path: artifacts/parity-report.json
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: web/dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
